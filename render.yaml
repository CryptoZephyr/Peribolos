# Render Blueprint for Peribolos V2 Backend API
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: peribolos-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build:sdk && npm run build -w @peribolos/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: SIGNER_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
    # Persistent disks require a paid plan on Render (Starter or above).
    # Uncomment below if deploying on a paid instance:
    # disk:
    #   name: peribolos-db-data
    #   mountPath: /app/apps/api/data
    #   sizeGB: 1

