[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
# Arc targets the Osaka hard fork; prague-and-earlier opcodes are safe on Arc.
# NOTE: local EVM (anvil/forge) cannot reproduce Arc-specific semantics
# (native-USDC single-asset model, blocklist, EIP-7708). Final validation
# happens against the live Arc testnet RPC — see script/ and README.
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1024

[invariant]
runs = 128
depth = 64

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"
